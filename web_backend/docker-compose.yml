version: '3.8'
services:
  web:
    build: .
    container_name: safecleaner_backend
    ports:
      - "5000:5000"
    volumes:
      - ./keys:/app/keys
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    restart: always
